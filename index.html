<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Vitals</title>
  <meta name="apple-mobile-web-app-title" content="Vitals">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f14; --card: #141824; --card2: #0d1117; --line: #1e2535; --line2: #2a3050;
      --text: #e8eaf0; --soft: #c8cee0; --muted: #8892b0; --dim: #5a6480; --faint: #3a4460;
      --blue: #4a9eff; --green: #00c88c; --orange: #ff8c4a; --purple: #c84aff; --amber: #ffb84a; --red: #ff4a6a;
      --protein: #4a9eff; --carbs: #ffb84a; --fat: #c84aff;
      --accent: #8b7cff; --accent2: #ff6fa8; --accent-bg: #1b1740;   /* Vitals: violet to pink */
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif; }
    body { min-height: 100vh; }
    button { font-family: inherit; cursor: pointer; }
    input, select { font-family: inherit; font-size: 16px; }
    .hidden { display: none !important; }

    /* header + nav */
    .top { position: sticky; top: 0; z-index: 50; background: linear-gradient(135deg, #1a1f2e, #0d1117); border-bottom: 1px solid var(--line);
      padding: calc(12px + env(safe-area-inset-top)) 14px 12px; display: flex; align-items: center; gap: 10px; }
    .brand { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: 2px; color: #fff; flex: 1; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .brand .mark { width: 22px; height: 22px; flex: none; }
    .iconbtn { background: none; border: none; color: var(--dim); font-size: 20px; padding: 4px 6px; line-height: 1; }
    main { padding: 14px 12px calc(96px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
    nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; background: var(--card2);
      border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    nav.tabs button { flex: 1; background: none; border: none; border-top: 2px solid transparent; color: var(--dim);
      font-size: 11px; font-weight: 700; padding: 9px 2px 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    nav.tabs button .ic { font-size: 18px; line-height: 1; }
    nav.tabs button.on { color: var(--accent); border-top-color: var(--accent); }

    /* building blocks */
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 13px; margin-bottom: 12px; }
    .label { font-size: 9.5px; color: var(--dim); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    .row { display: flex; align-items: center; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .muted { color: var(--muted); } .dim { color: var(--dim); } .faint { color: var(--faint); }
    .small { font-size: 11px; } .tiny { font-size: 10.5px; }
    .btn { border: none; border-radius: 10px; font-weight: 700; font-size: 14px; padding: 12px 14px; }
    .btn.primary { background: var(--accent); color: #0e0b24; }
    .btn.blue { background: #1a3a5a; color: #8ec5ff; border: 1px solid #2a5a8a; }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .btn.danger { background: transparent; color: var(--red); border: 1px solid #5a1a2a; }
    .btn.block { width: 100%; }
    .btn:disabled { opacity: .55; }
    .field { margin-bottom: 11px; }
    .field .label { display: block; margin-bottom: 5px; }
    .inp { width: 100%; background: #1e2535; border: 1px solid var(--line2); border-radius: 8px; color: var(--text); padding: 10px 11px; }
    .inp:focus { outline: none; border-color: var(--accent); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .seg { display: flex; gap: 6px; }
    .seg button { flex: 1; min-width: 0; background: var(--card2); border: 1px solid var(--line2); border-radius: 8px; color: var(--dim);
      font-size: 12.5px; font-weight: 700; padding: 9px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg button.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
    .search { margin-bottom: 10px; }
    .empty { text-align: center; color: var(--dim); font-size: 13px; padding: 22px 12px; }
    .btn.sm { padding: 7px 11px; font-size: 12px; }
    .sortbar { margin: -2px 0 10px; }
    .sortbar .seg button { padding: 6px 2px; font-size: 12px; }
    .fixed { color: var(--green); }
    .note { background: #10233a; border: 1px solid #2a5a8a; color: #8ec5ff; border-radius: 10px; padding: 9px 11px; font-size: 12px; line-height: 1.4; margin-bottom: 12px; }

    /* barcode scanner */
    .scanbox { position: relative; height: min(64vw, 300px); background: #000; border-radius: 12px; overflow: hidden; }
    .scanbox video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .scanguide { position: absolute; left: 10%; right: 10%; top: 50%; height: 2px; margin-top: -1px; background: var(--red); box-shadow: 0 0 8px var(--red); opacity: .9; }
    .scanbox.off { display: none; }

    /* lists */
    .list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
    .list .item { display: flex; align-items: center; gap: 10px; padding: 11px 13px; border-top: 1px solid #171d2b; }
    .list .item:first-child { border-top: none; }
    .list .item.tap { cursor: pointer; }
    .list .head { display: flex; align-items: center; justify-content: space-between; padding: 10px 13px; background: #10151f; border-bottom: 1px solid var(--line); }
    .name { font-size: 14px; color: var(--soft); }
    .sub { font-size: 11px; color: var(--faint); margin-top: 2px; }
    .kcal { font-size: 14px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .macros { font-size: 10.5px; margin-top: 2px; white-space: nowrap; }
    .macros b { font-weight: 700; }
    .p { color: var(--protein); } .c { color: var(--carbs); } .f { color: var(--fat); }
    .add { background: none; border: 1px solid var(--line2); color: var(--accent); border-radius: 8px; font-size: 13px; font-weight: 700; padding: 5px 11px; }

    /* today summary */
    .daynav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .daynav button { background: var(--card); border: 1px solid var(--line); color: var(--muted); border-radius: 10px; width: 42px; height: 38px; font-size: 16px; }
    .daynav .when { text-align: center; }
    .daynav .when .big { font-size: 16px; font-weight: 800; }
    .bar { height: 7px; border-radius: 4px; background: #1e2535; overflow: hidden; }
    .bar > div { height: 100%; border-radius: 4px; }
    .macro { margin-top: 10px; }
    .steps { margin-top: 8px; }
    .bar.thin { height: 5px; margin-top: 5px; }
    .macro .row { font-size: 12px; margin-bottom: 4px; }
    .ring-num { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }

    /* sheet: the overlay covers only the visible part of the screen, so a sheet
       sits above the on-screen keyboard (app.js keeps --vv-top / --vv-h up to date) */
    .veil { position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: var(--vv-h, 100%); z-index: 100; background: rgba(0,0,0,.6); }
    .sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; background: var(--card);
      border-top: 1px solid var(--line2); border-radius: 16px 16px 0 0; padding: 14px 14px calc(18px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
    .sheet h3 { margin: 0 0 12px; font-size: 16px; }
    .sheet .x { float: right; }
    .preview { background: var(--card2); border-radius: 10px; padding: 10px 12px; margin: 4px 0 12px; }
    .news { margin-bottom: 16px; }
    .news ul { margin: 7px 0 0; padding-left: 18px; }
    .news li { font-size: 13.5px; line-height: 1.45; color: var(--soft); margin-bottom: 7px; }
    .news li b { color: var(--text); }
    .ing { display: grid; grid-template-columns: 1fr 82px 64px 26px; gap: 6px; align-items: center; padding: 7px 0; border-top: 1px solid #171d2b; }
    .ing:first-child { border-top: none; }
    .ing .inp { padding: 7px 8px; text-align: right; }
    .x-btn { background: none; border: none; color: var(--dim); font-size: 16px; padding: 2px; }

    /* toast */
    .toast { position: fixed; left: 12px; right: 12px; bottom: max(calc(76px + env(safe-area-inset-bottom)), calc(var(--kb, 0px) + 12px)); z-index: 200; background: #1a1f2e;
      border: 1px solid var(--line2); border-radius: 10px; padding: 12px 14px; font-size: 13px; box-shadow: 0 4px 20px #000a; text-align: center; }
    .toast.err { border-color: #5a1a2a; color: #ff8fa3; }
    .toast.act { display: flex; align-items: center; gap: 12px; text-align: left; }
    .toast.act span { flex: 1; min-width: 0; }
    .toast button { background: none; border: 1px solid var(--line2); color: var(--accent); border-radius: 8px; padding: 6px 13px; font-weight: 700; font-size: 13px; }

    /* login */
    .login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; }
    .login .box { width: 100%; max-width: 320px; }
    .login h1 { margin: 0 0 4px; font-size: 22px; font-weight: 800; letter-spacing: 2px; text-align: center; }
    .login-mark { display: flex; justify-content: center; margin-bottom: 10px; }
    .login-mark .mark { width: 64px; height: 64px; }
    .login .inp { margin-bottom: 10px; padding: 13px 14px; background: var(--card); }
    .msg { font-size: 13px; text-align: center; margin: 10px 0; }
    .chart { width: 100%; height: 170px; display: block; }

    /* month view */
    .mchart { width: 100%; height: auto; display: block; margin-top: 4px; }
    .mchart [data-act] { cursor: pointer; outline: none; }
    .mchart [data-act]:focus-visible { stroke: var(--soft); stroke-width: 1; }
    .mkey { display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--muted); margin-top: 8px; }
    .mkey i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .mkey i.line { height: 0; border-top: 1px dashed var(--muted); border-radius: 0; vertical-align: 3px; width: 14px; }
    .mkey i.line.burn { border-top: 2px solid #c8cee0; }
    .mread { min-height: 36px; margin-top: 8px; font-size: 12.5px; color: var(--soft); }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mstat { background: var(--card2); border-radius: 10px; padding: 9px 10px; }
    .mstat .v { font-size: 17px; font-weight: 800; margin-top: 2px; }
    .up { color: var(--red); } .down { color: var(--green); }

    /* home */
    .hello { margin: 4px 2px 14px; }
    .hello .hi { font-size: 22px; font-weight: 800; color: #fff; }
    .tile { cursor: pointer; }
    .tile-h { gap: 8px; margin-bottom: 4px; }
    .tile .tic { font-size: 16px; line-height: 1; }
    .tile .chev { color: var(--dim); font-size: 20px; line-height: 1; }
    .tval { font-size: 34px; font-weight: 800; letter-spacing: -.5px; color: #fff; margin: 2px 0 8px; }
    .tval.sm { font-size: 26px; margin-bottom: 2px; }
    .kc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 4px; }
    .tv2 { font-size: clamp(17px, 5.4vw, 20px); font-weight: 800; color: var(--text); margin-top: 2px; white-space: nowrap; }
    .tv2.down { color: var(--green); } .tv2.up { color: var(--red); }
    .tiles2 { margin-bottom: 0; }
    .tiles2 .card { margin-bottom: 12px; min-width: 0; }
    .cheer { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #2a1f5c, #1b2b4a); border: 1px solid #4b3fa8;
      border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; font-size: 18px; font-weight: 800; color: #fff; line-height: 1.3; }
    .cheer[hidden] { display: none; }
    .cheer-e { font-size: 32px; line-height: 1; }
    .cheer.pop { animation: pop .6s cubic-bezier(.2, 1.4, .4, 1); }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .cheer.pop { animation: none; } }
    .confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 300; }

    /* health pages */
    .steps.tap { cursor: pointer; }
    #page { position: fixed; inset: 0; z-index: 80; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; }
    .pg { max-width: 640px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 12px calc(28px + env(safe-area-inset-bottom)); }
    .pg-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .pg-top h2 { margin: 0; font-size: 18px; font-weight: 800; }
    .pg-back { background: var(--card); border: 1px solid var(--line); color: var(--muted); border-radius: 10px; width: 42px; height: 38px; font-size: 22px; line-height: 1; }
    .hero { font-size: clamp(56px, 20vw, 104px); font-weight: 800; letter-spacing: -2px; line-height: 1.05; margin: 8px 0 14px; color: #fff; white-space: nowrap; }
    .hero-sm { font-size: 48px; font-weight: 800; letter-spacing: -1px; line-height: 1.1; margin: 4px 0 4px; color: #fff; }
    .bar.hero-bar { height: 10px; }
    .hchart { width: 100%; height: auto; display: block; margin-top: 12px; }
    .hchart [data-act] { cursor: pointer; outline: none; }
    .hchart [data-act]:focus-visible { stroke: var(--soft); stroke-width: 1; }
    .skey { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 11px; color: var(--muted); margin-top: 10px; }
    .skey i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
    .skey b { color: var(--soft); font-weight: 700; }
    details.tbl summary { cursor: pointer; color: var(--muted); }
    details.tbl[open] summary { margin-bottom: 6px; }
    details.tbl .tr { padding: 7px 0; border-top: 1px solid var(--line); gap: 12px; }
    details.tbl .tv { min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="page" class="hidden"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
  <script src="/vendor/supabase.js"></script>
  <script src="/app.js"></script>
</body>
</html>
